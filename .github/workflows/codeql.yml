name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents:        read
  security-events: write
  actions:         read

jobs:
  analyze:
    name: Analyze — JavaScript / TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        id: codeql
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

      - name: Notify Discord
        if: always()
        shell: python
        env:
          WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_CODEQL }}
          REPO:         ${{ github.repository }}
          BRANCH:       ${{ github.ref_name }}
          ACTOR:        ${{ github.actor }}
          RUN_ID:       ${{ github.run_id }}
          RUN_NUMBER:   ${{ github.run_number }}
          WORKFLOW:     ${{ github.workflow }}
          SHA:          ${{ github.sha }}
          EVENT:        ${{ github.event_name }}
          SCAN_RESULT:  ${{ steps.codeql.outcome }}
        run: |
          import json, os, urllib.request

          success = os.environ["SCAN_RESULT"] == "success"
          color   = 3066993 if success else 15158332
          status  = "Completed Successfully" if success else "Failed"

          fields = [
              {"name": "Repository", "value": f"[{os.environ['REPO']}](https://github.com/{os.environ['REPO']})", "inline": True},
              {"name": "Branch",     "value": f"`{os.environ['BRANCH']}`", "inline": True},
              {"name": "Event",      "value": f"`{os.environ['EVENT']}`",  "inline": True},
              {"name": "Language",   "value": "`javascript-typescript`",   "inline": True},
              {"name": "Commit",     "value": f"[`{os.environ['SHA'][:7]}`](https://github.com/{os.environ['REPO']}/commit/{os.environ['SHA']})", "inline": True},
              {"name": "Security Alerts", "value": f"[View in Security Tab](https://github.com/{os.environ['REPO']}/security/code-scanning)", "inline": False},
              {"name": "Workflow Run",    "value": f"[View Logs](https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']})",  "inline": False},
          ]

          payload = {"embeds": [{
              "title":       f"CodeQL Analysis — {status}",
              "description": (
                  f"Security and quality scan finished for **{os.environ['REPO']}**. Review any new alerts in the Security tab."
                  if success else
                  f"CodeQL analysis **failed** for **{os.environ['REPO']}**. Investigate the workflow logs."
              ),
              "color":  color,
              "fields": fields,
              "footer": {"text": f"{os.environ['WORKFLOW']} | Run #{os.environ['RUN_NUMBER']}"},
          }]}

          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req): pass
