name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prettier
        id: prettier
        run: npm run format:check

      - name: ESLint
        id: eslint
        run: npm run lint

      - name: TypeScript
        id: typecheck
        run: npm run typecheck

      - name: Notify Discord — failure
        if: failure()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CI }}
          REPO:        ${{ github.repository }}
          BRANCH:      ${{ github.ref_name }}
          ACTOR:       ${{ github.actor }}
          RUN_ID:      ${{ github.run_id }}
          RUN_NUMBER:  ${{ github.run_number }}
          WORKFLOW:    ${{ github.workflow }}
          SHA:         ${{ github.sha }}
          EVENT:       ${{ github.event_name }}
          PRETTIER:    ${{ steps.prettier.outcome }}
          ESLINT:      ${{ steps.eslint.outcome }}
          TYPECHECK:   ${{ steps.typecheck.outcome }}
        run: |
          [ -z "$WEBHOOK_URL" ] && echo "DISCORD_WEBHOOK_CI secret not set, skipping" && exit 0

          FAILED=""
          [ "$PRETTIER"  = "failure" ] && FAILED="${FAILED:+$FAILED, }Prettier"
          [ "$ESLINT"    = "failure" ] && FAILED="${FAILED:+$FAILED, }ESLint"
          [ "$TYPECHECK" = "failure" ] && FAILED="${FAILED:+$FAILED, }TypeScript"
          [ -z "$FAILED" ] && FAILED="None"

          PAYLOAD=$(jq -nc \
            --arg title "CI Pipeline — Quality Check Failed" \
            --arg desc "Checks failed on ${BRANCH}" \
            --arg repo "https://github.com/${REPO}" \
            --arg branch "$BRANCH" \
            --arg event "$EVENT" \
            --arg actor "$ACTOR" \
            --arg sha "${SHA:0:7}" \
            --arg failed "$FAILED" \
            --arg run_url "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            --arg footer "${WORKFLOW} | Run #${RUN_NUMBER}" \
            '{embeds:[{
              title: $title,
              description: $desc,
              color: 15158332,
              fields: [
                {name:"Repository",   value:$repo,    inline:true},
                {name:"Branch",       value:$branch,  inline:true},
                {name:"Event",        value:$event,   inline:true},
                {name:"Triggered By", value:$actor,   inline:true},
                {name:"Commit",       value:$sha,     inline:true},
                {name:"Failed Steps", value:$failed,  inline:false},
                {name:"Workflow Run", value:$run_url, inline:false}
              ],
              footer: {text: $footer}
            }]}')

          HTTP=$(curl -sS -o /dev/stderr -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Discord responded: HTTP $HTTP"
