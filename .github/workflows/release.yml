name: Release

on:
push:
branches: [main]

env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
contents: write
issues: write
pull-requests: write
id-token: write

jobs:
semantic-release:
name: Semantic Release
runs-on: ubuntu-latest
outputs:
tag: ${{ steps.release.outputs.tag }}

```
steps:
  - uses: actions/checkout@v5
    with:
      fetch-depth: 0
      persist-credentials: false

  - uses: actions/setup-node@v5
    with:
      node-version: 24
      cache: npm

  - run: npm install --no-audit --no-fund

  - id: release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
    run: |
      npx semantic-release
      TAG=$(git describe --tags --abbrev=0)
      echo "tag=$TAG" >> $GITHUB_OUTPUT
```

build-windows:
name: Build Windows
runs-on: windows-latest
needs: semantic-release

```
steps:
  - uses: actions/checkout@v5
    with:
      ref: ${{ needs.semantic-release.outputs.tag }}

  - uses: actions/setup-node@v5
    with:
      node-version: 24
      cache: npm

  - run: npm install --no-audit --no-fund
  - run: npm run build
  - run: npx electron-builder --win --publish never

  - shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.semantic-release.outputs.tag }}
    run: |
      ls -R dist
      gh release upload "$TAG" dist/*.exe dist/latest.yml --clobber
```

build-macos:
name: Build macOS
runs-on: macos-latest
needs: semantic-release

```
steps:
  - uses: actions/checkout@v5
    with:
      ref: ${{ needs.semantic-release.outputs.tag }}

  - uses: actions/setup-node@v5
    with:
      node-version: 24
      cache: npm

  - run: npm install --no-audit --no-fund
  - run: npm run build

  - env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
    run: npx electron-builder --mac --publish never

  - env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.semantic-release.outputs.tag }}
    run: |
      ls -R dist
      gh release upload "$TAG" dist/*.dmg dist/latest-mac.yml --clobber
```

build-linux:
name: Build Linux
runs-on: ubuntu-latest
needs: semantic-release

```
steps:
  - uses: actions/checkout@v5
    with:
      ref: ${{ needs.semantic-release.outputs.tag }}

  - uses: actions/setup-node@v5
    with:
      node-version: 24
      cache: npm

  - run: npm install --no-audit --no-fund
  - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
  - run: npm run build
  - run: npx electron-builder --linux --publish never

  - env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.semantic-release.outputs.tag }}
    run: |
      ls -R dist
      gh release upload "$TAG" dist/*.AppImage dist/latest-linux.yml --clobber
```
