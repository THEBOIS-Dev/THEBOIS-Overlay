name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents:      write
  issues:        write
  pull-requests: write
  id-token:      write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version:   ${{ steps.release.outputs.new_release_version }}
      new_release_git_tag:   ${{ steps.release.outputs.new_release_git_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME:     github-actions[bot]
          GIT_AUTHOR_EMAIL:    github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME:  github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          npx semantic-release | tee output.txt

          if grep -q "Published release" output.txt; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi

          TAG=$(git describe --tags --abbrev=0)
          echo "new_release_git_tag=$TAG" >> $GITHUB_OUTPUT

          VERSION="${TAG#v}"
          echo "new_release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Notify Discord — semantic-release failure
        if: failure()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CI }}
          REPO:        ${{ github.repository }}
          BRANCH:      ${{ github.ref_name }}
          ACTOR:       ${{ github.actor }}
          RUN_ID:      ${{ github.run_id }}
          RUN_NUMBER:  ${{ github.run_number }}
          WORKFLOW:    ${{ github.workflow }}
          SHA:         ${{ github.sha }}
        run: |
          [ -z "$WEBHOOK_URL" ] && echo "DISCORD_WEBHOOK_CI secret not set, skipping" && exit 0

          PAYLOAD=$(jq -nc \
            --arg title "Release Pipeline — semantic-release Failed" \
            --arg desc "Version determination failed for **${REPO}**. No release was created." \
            --arg repo "https://github.com/${REPO}" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "${SHA:0:7}" \
            --arg run_url "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            --arg footer "${WORKFLOW} | Run #${RUN_NUMBER}" \
            '{embeds:[{
              title: $title,
              description: $desc,
              color: 15158332,
              fields: [
                {name:"Repository",   value:$repo,    inline:true},
                {name:"Branch",       value:$branch,  inline:true},
                {name:"Triggered By", value:$actor,   inline:true},
                {name:"Commit",       value:$sha,     inline:true},
                {name:"Workflow Run", value:$run_url, inline:false}
              ],
              footer: {text: $footer}
            }]}')

          HTTP=$(curl -sS -o /dev/stderr -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Discord responded: HTTP $HTTP"

  build-windows:
    name: Build — Windows (x64)
    runs-on: windows-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile (tsc + vite)
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.semantic-release.outputs.new_release_git_tag }}
        run: |
          gh release upload "$TAG" dist/*.exe dist/latest.yml --clobber

  build-macos:
    name: Build — macOS (universal)
    runs-on: macos-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile (tsc + vite)
        run: npm run build

      - name: Package macOS DMG
        env:
          CSC_LINK:         ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: npx electron-builder --mac --publish never

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.semantic-release.outputs.new_release_git_tag }}
        run: |
          gh release upload "$TAG" dist/*.dmg dist/latest-mac.yml --clobber

  build-linux:
    name: Build — Linux (AppImage)
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Compile (tsc + vite)
        run: npm run build

      - name: Package Linux AppImage
        run: npx electron-builder --linux --publish never

      - name: Upload AppImage to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.semantic-release.outputs.new_release_git_tag }}
        run: |
          gh release upload "$TAG" dist/*.AppImage dist/latest-linux.yml --clobber

  notify:
    name: Notify Discord — Release Summary
    runs-on: ubuntu-latest
    needs: [semantic-release, build-windows, build-macos, build-linux]
    if: always() && needs.semantic-release.outputs.new_release_published == 'true'

    steps:
      - name: Post to Discord
        continue-on-error: true
        env:
          WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          REPO:         ${{ github.repository }}
          ACTOR:        ${{ github.actor }}
          RUN_ID:       ${{ github.run_id }}
          RUN_NUMBER:   ${{ github.run_number }}
          WORKFLOW:     ${{ github.workflow }}
          VERSION:      ${{ needs.semantic-release.outputs.new_release_version }}
          TAG:          ${{ needs.semantic-release.outputs.new_release_git_tag }}
          WIN_RESULT:   ${{ needs.build-windows.result }}
          MAC_RESULT:   ${{ needs.build-macos.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
        run: |
          [ -z "$WEBHOOK_URL" ] && echo "DISCORD_WEBHOOK_RELEASES secret not set, skipping" && exit 0

          badge() {
            case "$1" in
              success)   echo "Pass"      ;;
              failure)   echo "Failed"    ;;
              cancelled) echo "Cancelled" ;;
              *)         echo "Skipped"   ;;
            esac
          }

          WIN_BADGE=$(badge "$WIN_RESULT")
          MAC_BADGE=$(badge "$MAC_RESULT")
          LINUX_BADGE=$(badge "$LINUX_RESULT")

          if [ "$WIN_RESULT" = "success" ] && [ "$MAC_RESULT" = "success" ] && [ "$LINUX_RESULT" = "success" ]; then
            COLOR=3066993
            LABEL="All Platforms Built Successfully"
          elif [ "$WIN_RESULT" = "failure" ] || [ "$MAC_RESULT" = "failure" ] || [ "$LINUX_RESULT" = "failure" ]; then
            COLOR=15158332
            LABEL="Build Completed with Failures"
          else
            COLOR=16776960
            LABEL="Build Completed"
          fi

          PAYLOAD=$(jq -nc \
            --arg title "Release ${TAG} — ${LABEL}" \
            --arg desc "${VERSION} has been published. https://github.com/${REPO}/releases/tag/${TAG}" \
            --argjson color "$COLOR" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg win "$WIN_BADGE" \
            --arg mac "$MAC_BADGE" \
            --arg linux "$LINUX_BADGE" \
            --arg logs "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            --arg footer "${WORKFLOW} | Run #${RUN_NUMBER}" \
            '{embeds:[{
              title: $title,
              description: $desc,
              color: $color,
              fields: [
                {name:"Version", value:$version, inline:true},
                {name:"Tag",     value:$tag,     inline:true},
                {name:"Windows", value:$win,     inline:true},
                {name:"macOS",   value:$mac,     inline:true},
                {name:"Linux",   value:$linux,   inline:true},
                {name:"Logs",    value:$logs,    inline:false}
              ],
              footer: {text: $footer}
            }]}')

          HTTP=$(curl -sS -o /dev/stderr -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Discord responded: HTTP $HTTP"