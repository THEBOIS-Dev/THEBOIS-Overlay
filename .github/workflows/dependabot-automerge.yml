name: Auto-merge Dependabot

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge-pr:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for PR to become mergeable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for i in {1..30}; do
            STATE=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            echo "Merge state: $STATE"

            if [ "$STATE" = "CLEAN" ]; then
              break
            fi

            sleep 5
          done

      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash

  automerge-existing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Process all open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list \
            --repo "$REPO" \
            --author "app/dependabot" \
            --state open \
            --json number \
            --jq '.[].number')

          if [ -z "$prs" ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi

          for pr in $prs; do
            echo "Processing PR #$pr"

            for i in {1..30}; do
              STATE=$(gh pr view "$pr" \
                --repo "$REPO" \
                --json mergeStateStatus \
                --jq .mergeStateStatus)

              echo "Merge state: $STATE"

              if [ "$STATE" = "CLEAN" ]; then
                break
              fi

              sleep 5
            done

            gh pr review "$pr" \
              --repo "$REPO" \
              --approve || true

            gh pr merge "$pr" \
              --repo "$REPO" \
              --auto \
              --squash || true
          done
